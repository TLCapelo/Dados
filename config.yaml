# Configuração do Pipeline de Dados - Estudo
# Edite este arquivo para ajustar parâmetros sem mexer no código

# ==========================================
# OPEN-METEO (Clima)
# ==========================================
open_meteo:
  base_url: "https://api.open-meteo.com/v1/forecast"
  # Cidades brasileiras para monitorar (lat, lon, nome, estado)
  cities:
    - name: "São Paulo"
      state: "SP"
      latitude: -23.5505
      longitude: -46.6333
    - name: "Rio de Janeiro"
      state: "RJ"
      latitude: -22.9068
      longitude: -43.1729
    - name: "Brasília"
      state: "DF"
      latitude: -15.7975
      longitude: -47.8825
    - name: "Florianópolis"
      state: "SC"
      latitude: -27.5954
      longitude: -48.5480
    - name: "Fortaleza"
      state: "CE"
      latitude: -3.7319
      longitude: -38.5267
    - name: "Manaus"
      state: "AM"
      latitude: -3.1190
      longitude: -60.0217
    - name: "Porto Alegre"
      state: "RS"
      latitude: -30.0346
      longitude: -51.2177
    - name: "Belo Horizonte"
      state: "MG"
      latitude: -19.9167
      longitude: -43.9345
    - name: "Salvador"
      state: "BA"
      latitude: -12.9714
      longitude: -38.5014
    - name: "Recife"
      state: "PE"
      latitude: -8.0476
      longitude: -34.8770
  
  # Variáveis climáticas a coletar (diárias)
  daily_variables:
    - "temperature_2m_max"
    - "temperature_2m_min"
    - "temperature_2m_mean"
    - "precipitation_sum"
    - "rain_sum"
    - "snowfall_sum"
    - "windspeed_10m_max"
    - "windgusts_10m_max"
    - "winddirection_10m_dominant"
    - "shortwave_radiation_sum"
    - "et0_fao_evapotranspiration"
    - "relative_humidity_2m_mean"
    - "surface_pressure_mean"
    - "cloudcover_mean"
    - "uv_index_max"
    - "precipitation_probability_max"
  
  # Variáveis horárias (opcional, mais dados)
  hourly_variables:
    - "temperature_2m"
    - "relative_humidity_2m"
    - "precipitation"
    - "rain"
    - "windspeed_10m"
    - "winddirection_10m"
    - "surface_pressure"
    - "cloudcover"
    - "uv_index"
  
  timezone: "America/Sao_Paulo"
  forecast_days: 2  # Pega hoje + ontem (para garantir histórico)
  past_days: 1

# ==========================================
# COINGECKO (Criptomoedas)
# ==========================================
coingecko:
  base_url: "https://api.coingecko.com/api/v3"
  # Moedas para monitorar (id da CoinGecko)
  coins:
    - id: "bitcoin"
      symbol: "BTC"
      name: "Bitcoin"
    - id: "ethereum"
      symbol: "ETH"
      name: "Ethereum"
    - id: "binancecoin"
      symbol: "BNB"
      name: "BNB"
    - id: "solana"
      symbol: "SOL"
      name: "Solana"
    - id: "polkadot"
      symbol: "DOT"
      name: "Polkadot"
    - id: "polygon-ecosystem-token"
      symbol: "POL"
      name: "POL (ex-MATIC)"
    - id: "litecoin"
      symbol: "LTC"
      name: "Litecoin"
  
  # Moedas fiat para conversão
  vs_currencies: ["brl", "usd"]
  
  # Dados de mercado a coletar
  market_data:
    - "current_price"
    - "market_cap"
    - "total_volume"
    - "price_change_percentage_24h"
    - "price_change_percentage_7d"
    - "price_change_percentage_30d"
    - "circulating_supply"
    - "total_supply"
    - "max_supply"
    - "ath"
    - "ath_change_percentage"
    - "atl"
    - "atl_change_percentage"
    - "last_updated"
  
  # Histórico de preços (dias)
  price_history_days: 30
  
  # Rate limit: 10-30 req/min no free tier (sem API key)
  # Com API key gratuita no site da CoinGecko: 50-100 req/min
  rate_limit_per_minute: 10

# ==========================================
# BCB/SGS (Banco Central do Brasil)
# ==========================================
bcb:
  base_url: "https://api.bcb.gov.br/dados/serie/bcdata.sgs"
  # Séries do SGS (Sistema Gerenciador de Séries Temporais).
  # Cada série tem um "kind", que define como o dashboard e o enriquecimento
  # calculam a variação (porcentagem para preços, pontos percentuais para taxas):
  #   price        preço/cotação diária      -> variação %, média móvel, z-score
  #   stock        saldo diário              -> variação %
  #   rate         taxa em % a.a.            -> variação em p.p.
  #   monthly_rate taxa mensal em % a.m.     -> variação em p.p. + acumulado 12 meses
  #   level_pct    nível em % (desemprego, dívida % PIB) -> variação em p.p.
  #   index        número-índice (IBC-Br)    -> variação % mensal e em 12 meses
  series:
    - {code: 1,     name: "dolar_venda",  description: "Dólar comercial (venda)",      unit: "R$",             kind: price,        frequency: daily,   decimals: 4, lookback_days: 400}
    - {code: 21620, name: "euro_venda",   description: "Euro (venda)",                  unit: "R$",             kind: price,        frequency: daily,   decimals: 4, lookback_days: 400}
    - {code: 13621, name: "reservas",     description: "Reservas internacionais",       unit: "US$ milhões",    kind: stock,        frequency: daily,   decimals: 0, lookback_days: 400}
    - {code: 432,   name: "selic_meta",   description: "Meta Selic",                    unit: "% a.a.",         kind: rate,         frequency: daily,   decimals: 2, lookback_days: 1100}
    - {code: 4392,  name: "cdi_anual",    description: "CDI anualizado (média do mês)", unit: "% a.a.",         kind: rate,         frequency: monthly, decimals: 2, lookback_days: 1100}
    - {code: 433,   name: "ipca_mensal",  description: "IPCA (variação mensal)",        unit: "% a.m.",         kind: monthly_rate, frequency: monthly, decimals: 2, lookback_days: 1100}
    - {code: 13522, name: "ipca_12m",     description: "IPCA acumulado em 12 meses",    unit: "% em 12 meses",  kind: rate,         frequency: monthly, decimals: 2, lookback_days: 1100}
    - {code: 189,   name: "igpm_mensal",  description: "IGP-M (variação mensal)",       unit: "% a.m.",         kind: monthly_rate, frequency: monthly, decimals: 2, lookback_days: 1100}
    - {code: 24369, name: "desemprego",   description: "Taxa de desemprego (PNAD)",     unit: "%",              kind: level_pct,    frequency: monthly, decimals: 1, lookback_days: 1100}
    - {code: 24364, name: "ibc_br",       description: "IBC-Br (atividade econômica)",  unit: "índice",         kind: index,        frequency: monthly, decimals: 1, lookback_days: 1100}
    - {code: 13762, name: "divida_bruta", description: "Dívida bruta do governo geral", unit: "% do PIB",       kind: level_pct,    frequency: monthly, decimals: 1, lookback_days: 1100}
    - {code: 4513,  name: "divida_liquida", description: "Dívida líquida do setor público", unit: "% do PIB",   kind: level_pct,    frequency: monthly, decimals: 1, lookback_days: 1100}

  # Formato de data para a API
  date_format: "%d/%m/%Y"

  # Janela padrão (dias) quando a série não define lookback_days
  lookback_days: 60

# ==========================================
# PIPELINE SETTINGS
# ==========================================
pipeline:
  # Diretórios de dados
  paths:
    raw: "data/raw"
    staging: "data/staging"
    serving: "data/serving"
  
  # Formato de saída
  output_format: "parquet"  # parquet ou csv
  partition_by: "date"  # Particionamento por data
  
  # Validação
  validation:
    enabled: true
    fail_on_error: false  # Se true, para o pipeline em erro de validação
  
  # Logs
  logging:
    level: "INFO"
    file: "logs/pipeline.log"
  
  # GitHub Pages / Deploy
  deploy:
    enabled: true
    branch: "gh-pages"
    serving_path: "data/serving"

# ==========================================
# POWER BI SETTINGS
# ==========================================
powerbi:
  # Configuração para conexão no Power BI
  dataset_name: "Estudo_Dados_Diarios"
  # URL base para acessar os dados no GitHub Pages
  # Será preenchido após primeiro deploy: https://<user>.github.io/<repo>/data/serving/
  github_pages_base_url: "https://tlcapelo.github.io/Dados/"
  
  # Tabelas esperadas no modelo
  tables:
    - name: "clima_diario"
      source: "serving/clima/diario/*.parquet"
      key: ["city", "state", "date"]
    - name: "clima_horario"
      source: "serving/clima/horario/*.parquet"
      key: ["city", "state", "datetime"]
    - name: "crypto_diario"
      source: "serving/crypto/diario/*.parquet"
      key: ["coin_id", "date"]
    - name: "crypto_historico"
      source: "serving/crypto/historico/*.parquet"
      key: ["coin_id", "date"]
    - name: "economia_diario"
      source: "serving/economia/diario/*.parquet"
      key: ["series_code", "date"]