name: Daily Data Pipeline

on:
  schedule:
    # Roda a cada 3 horas (8 vezes ao dia)
    - cron: '0 */3 * * *'
  workflow_dispatch:  # Permite execução manual
  push:
    branches: [main]
    paths:
      - '.github/workflows/etl.yml'
      - 'src/**'
      - 'config.yaml'
      - 'requirements.txt'

concurrency:
  group: daily-data-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  # Necessário para push no gh-pages
  pages: write
  id-token: write

jobs:
  etl:
    name: Extract, Transform, Load
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necessário para push no gh-pages
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Pipeline
        id: pipeline
        run: |
          python src/pipeline.py
        env:
          PYTHONPATH: ${{ github.workspace }}
      
      - name: Stage and check data changes
        id: changes
        run: |
          git add --all --force -- data/serving/
          if git diff --cached --quiet -- data/serving/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Nenhuma mudança nos dados"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Dados atualizados"
          fi
      
      - name: Commit and push data changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git commit -m "chore(data): atualização diária $(date -u +'%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase -X theirs origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
          done

          echo "Falha ao publicar os dados após 3 tentativas." >&2
          exit 1
      
      - name: Deploy to GitHub Pages
        if: steps.changes.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./data/serving
          publish_branch: gh-pages
          force: true
      
      - name: Upload pipeline logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-logs
          path: logs/
          retention-days: 7
      
      - name: Upload validation reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: data/serving/powerbi/
          retention-days: 7

  notify:
    name: Notify on Failure
    needs: etl
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send failure notification
        run: |
          echo "Pipeline falhou! Verifique os logs na aba Actions."
          # Aqui você pode adicionar notificação por email, Slack, Discord, etc.
          # Exemplo com webhook Discord:
          # curl -X POST -H "Content-Type: application/json" \
          #   -d '{"content": "❌ Pipeline de dados falhou: ${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
          #   ${{ secrets.DISCORD_WEBHOOK }}